[project]
name = "aicrm-ai-service"
version = "0.1.0"
description = "AI获客销售系统 - AI 能力服务（意向分类/RAG问答/实体抽取/对话摘要）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.12",
    "pydantic-settings>=2.8",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
# 确保 pytest 可导入项目根目录下的 app 包（uv 隔离环境下需要）
pythonpath = ["."]

[tool.uv]
# 默认镜像源：清华 PyPI（国内加速）
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
