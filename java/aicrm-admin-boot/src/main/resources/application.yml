server:
  port: 8080

spring:
  application:
    name: aicrm
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        # 消费失败重试：3 次后进入死信队列
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000
          multiplier: 2
          max-interval: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

# 业务自定义配置
aicrm:
  web:
    cors:
      # Comma-separated frontend origins. Credentials require explicit origins instead of a wildcard.
      allowed-origins: ${AICRM_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  id:
    worker-id: ${AICRM_ID_WORKER_ID:0}
    datacenter-id: ${AICRM_ID_DATACENTER_ID:0}
  sales:
    recycle:
      # 迁移后默认关闭，完成公海规则配置和验收后通过环境变量显式开启。
      enabled: ${AICRM_SALES_RECYCLE_ENABLED:false}
      cron: ${AICRM_SALES_RECYCLE_CRON:0 */10 * * * *}
      zone: ${AICRM_SALES_RECYCLE_ZONE:UTC}
      batch-size: ${AICRM_SALES_RECYCLE_BATCH_SIZE:100}
  outbox:
    enabled: ${AICRM_OUTBOX_ENABLED:false}
    interval-millis: ${AICRM_OUTBOX_INTERVAL_MILLIS:5000}
    batch-size: ${AICRM_OUTBOX_BATCH_SIZE:100}
    lease-seconds: ${AICRM_OUTBOX_LEASE_SECONDS:300}
  # JWT 认证
  jwt:
    # 签名密钥（生产环境通过环境变量 AICRM_JWT_SECRET 注入，至少 32 字节）
    secret: ${AICRM_JWT_SECRET:aicrm-dev-secret-change-me-in-production-0123456789abcdef}
    # 令牌有效期（秒），默认 24h
    expire-seconds: 86400

springdoc:
  # 文档开关：默认开启（开发/测试），生产环境 application-prod.yml 强制关闭；可用环境变量 AICRM_DOC_ENABLED 覆盖
  api-docs:
    enabled: ${AICRM_DOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${AICRM_DOC_ENABLED:true}
    path: /swagger-ui.html
    # 原生 Swagger UI 调试增强（开箱即用）；文档分组见 OpenApiConfig 的 GroupedOpenApi Bean（swagger-ui 自动生成分组下拉）
    display-request-duration: true     # 接口列表显示请求耗时
    persist-authorization: true        # 页面刷新后保留已填写的 Authorization
    try-it-out-enabled: true           # 默认展开 Try it out 调试面板
    filter: true                       # 顶部接口名称/路径过滤
    tags-sorter: alpha                 # 分组按字母排序
    operations-sorter: alpha           # 接口按字母排序

logging:
  level:
    com.aicrm: info
