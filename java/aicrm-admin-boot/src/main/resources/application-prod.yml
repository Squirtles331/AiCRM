spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aicrm}
    username: ${DB_USERNAME:aicrm}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:aicrm}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}

# 生产环境强制关闭接口文档（/doc.html、/v3/api-docs、/swagger-ui.html 均不可访问）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# 生产环境强制关闭 Knife4j 增强 UI（/doc.html）
knife4j:
  enable: false
  setting:
    mock: false

logging:
  level:
    com.aicrm: info
