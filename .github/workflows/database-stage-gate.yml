name: Database stage gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify migrations, database invariants, module boundaries and RabbitMQ transport
        run: mvn -B -f java/pom.xml verify -Daicrm.rabbitmq.integration.enabled=true
